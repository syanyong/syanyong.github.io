name: Generate CV PDF

on:
  push:
    branches:
      - master
      - main
    paths:
      - "_data/cv.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cv.txt

      - name: Install PDF dependencies
        run: python -m pip install -r requirements-cv.txt

      - name: Generate CV PDF
        run: python bin/generate_cv.py

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy PDF to gh-pages
        run: |
          mkdir -p gh-pages/assets/pdf
          cp assets/pdf/CV_SYanyong.pdf gh-pages/assets/pdf/CV_SYanyong.pdf

      - name: Commit generated PDF to gh-pages
        run: |
          cd gh-pages
          if git diff --quiet -- assets/pdf/CV_SYanyong.pdf; then
            echo "CV PDF is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pdf/CV_SYanyong.pdf
          git commit -m "chore: regenerate CV PDF"
          git push
